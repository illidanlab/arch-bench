# Public edition: definitions identical; internal references removed; citations to earlier internal versions are lineage pointers not included here.
#
# ARCH-Bench concern ontology v0.2 — DRAFT
#
# Anchoring: domain coverage is structurally anchored to the public
# NCCN Distress Thermometer problem-list *shape* and to PROMIS Pediatric
# self-report domains. All label names, definitions, and examples below are
# ORIGINAL WORDING — nothing is reproduced from a proprietary instrument, and
# no clinical score is computed. This ontology is provisional and will be
# superseded by a future ontology via ontology/mappings/.
#
# v0.2 is ADDITIVE over v0.1 (ontology/ontology_v0.1.yaml, unchanged and
# still the reference for corpus v0.1). Changes below come from the clinician
# realism review (findings F4/F9) and are recorded in
# ontology/mappings/v01_to_v02.md. Nine domains, no new top-level domain;
# subdomain count moves 46 -> 51: five new subdomains
# (physical_symptoms/procedure_distress, emotional_concerns/withdrawal_not_themselves,
# emotional_concerns/hair_loss_appearance, family_sibling/privacy_hovering,
# practical_logistical/hospital_time_distance), plus extended exemplars on
# other_side_effect_experienced and family_conflict (no new subdomains there).
# body_image narrows: hair loss and visible-change distress (hats, mirrors,
# stares) split out to hair_loss_appearance; body_image keeps weight, shape,
# and non-hair appearance changes. See ontology/mappings/v01_to_v02.md.

version: 0.2.0
status: draft
anchors:
  - name: NCCN Distress Thermometer problem list
    use: structural anchor for domain coverage (shape only; copyrighted text not reproduced)
  - name: PROMIS Pediatric self-report domains
    use: anchor for child-appropriate domain language (publicly available)
  - name: Study design specification (dyadic communication aims)
    use: source of dyadic/communication domains absent from screening instruments
  - name: Clinician realism review (2026-07-31)
    use: source of v0.2 vocabulary additions (F4/F9)

domains:
  - label: physical_symptoms
    display: Physical symptoms
    definition: >
      Bodily experiences the speaker reports as a problem or worry, including
      treatment side effects experienced in the body.
    include:
      - pain, nausea, fatigue, sleep or appetite changes reported as a concern
      - physical side effects the speaker is experiencing
      - pain, fear, or discomfort during a procedure itself — port access
        (including multiple attempts), dressing changes, adhesive removal
        (procedure_distress)
      - constipation, mouth sores, difficulty drinking enough fluids, steroid
        puffiness, rash (other_side_effect_experienced)
    exclude:
      - questions about what side effects to expect (treatment_questions)
      - inability to do activities framed as lost normalcy (quality_of_life)
      - dread or worry about an upcoming procedure before it happens
        (emotional_concerns/treatment_fear)
    child_examples:
      - "My legs hurt at night and it wakes me up."
      - "I feel like throwing up after the medicine."
      - "It hurt so bad when they had to stick the port three times."
      - "My mouth has these sores and it hurts to eat."
    parent_examples:
      - "She's been so tired she sleeps most of the afternoon."
      - "The dressing change is the worst part of her week, not the chemo itself."
      - "He's so puffy in the face from the steroids he doesn't look like himself."
    confusions:
      - "fatigue limiting play: physical_symptoms if the symptom is the focus, quality_of_life if the lost activity is the focus"
      - "procedure_distress vs treatment_fear: procedure_distress is the physical experience of the procedure itself, in the moment or right after (pain, multiple access attempts, dressing changes, adhesive removal); treatment_fear (emotional_concerns) is the anticipatory dread before the procedure happens"
    subdomains:
      - pain
      - nausea_vomiting
      - fatigue
      - sleep_problems
      - appetite_eating
      - mobility_physical_activity
      - other_side_effect_experienced
      - procedure_distress
    summary_display: Report symptom, who reported it, and stated impact.

  - label: emotional_concerns
    display: Emotional concerns
    definition: >
      Feelings the speaker identifies as distressing for themselves, such as
      fear, sadness, worry, anger, or loneliness.
    include:
      - fear of procedures or treatment
      - worry about the future, sadness, irritability, feeling alone
      - self-consciousness about weight, shape, or other non-hair appearance
        changes (body_image)
      - distress about hair loss and being seen — hats, mirrors, stares
        (hair_loss_appearance)
      - a child seeming flat, checked out, or not doing typical things,
        without a named feeling attached (withdrawal_not_themselves)
    exclude:
      - worry about a family member's feelings (family_sibling)
      - existential or meaning-focused distress (spiritual_existential)
      - acute-risk statements (safety taxonomy, not a concern domain)
    child_examples:
      - "I get really scared the night before the poke."
      - "I don't want my friends to see me without hair."
      - "I don't really feel like doing anything, I just don't."
    parent_examples:
      - "I keep bracing for the next scan results."
      - "She won't leave the house without a hat since her hair started coming out."
      - "She's just not herself lately — quiet, doesn't want to talk, doesn't play."
    confusions:
      - a parent describing the child's fear is speaker=parent observing the
        child; annotation guide governs attribution
      - "withdrawal_not_themselves vs sadness: sadness is a feeling the speaker names directly; withdrawal_not_themselves is an observed behavior or affect change, typically parent-reported, with no named feeling behind it"
      - "hair_loss_appearance vs body_image: hair loss and being-seen distress (hats, mirrors, stares) is hair_loss_appearance; body_image narrows to weight, shape, and other non-hair appearance changes (see ontology/mappings/v01_to_v02.md)"
    subdomains:
      - treatment_fear
      - worry_about_future
      - sadness
      - anger_frustration
      - body_image
      - loneliness_isolation
      - hair_loss_appearance
      - withdrawal_not_themselves
    summary_display: Name the feeling and its stated trigger; do not infer diagnoses.

  - label: family_sibling
    display: Family and sibling concerns
    definition: >
      Concerns about the effect of illness or treatment on family members,
      family relationships, or family functioning.
    include:
      - sibling distress or reduced attention to siblings
      - strain between caregivers, protecting family members' feelings
      - coparenting friction — disagreement, blame, or absence between
        separated or divorced parents; complaints about the other parent's
        involvement or follow-through (family_conflict)
      - hovering parents, lack of privacy, a monitored phone or door
        (privacy_hovering)
    exclude:
      - logistics of caregiving coverage (practical_logistical)
    child_examples:
      - "My little brother cries when I go to the hospital."
      - "I don't tell Mom when I feel bad because she gets upset."
      - "My mom won't even let me close my door anymore."
    parent_examples:
      - "His sister is acting out at school since the diagnosis."
      - "His dad never shows up for appointments and then second-guesses everything I decide."
    confusions:
      - '"who watches the sibling during infusions" is practical_logistical'
      - "privacy_hovering vs practical_logistical: a parent worried about who supervises the child during treatment is practical_logistical/work_childcare_coverage; privacy_hovering is about monitoring or closeness itself (phone checks, no closed door), not coverage"
    subdomains:
      - sibling_impact
      - caregiver_strain
      - family_conflict
      - protecting_family_feelings
      - privacy_hovering
    summary_display: State whose relationship or wellbeing is affected and how.

  - label: practical_logistical
    display: Practical and logistical concerns
    definition: >
      Concrete resource, scheduling, or task problems in managing daily life
      and care, including operational medication management.
    include:
      - transportation, finances, insurance, work or childcare coverage
      - getting refills, fitting doses into the daily routine, missed doses
      - the cumulative burden of time spent at the hospital or clinic, and
        the distance or commute between home and the treatment center
        (hospital_time_distance)
    exclude:
      - confusion about what an instruction means (treatment_questions)
    child_examples:
      - "We drive really far and I miss my shows."
      - "We're always in the car, it feels like we live on the road."
    parent_examples:
      - "The pharmacy keeps delaying the refill and we run close to empty."
      - "I can't take more time off work for the Tuesday appointments."
      - "We spend more time at the hospital than at home some weeks."
    confusions:
      - unclear instructions vs. inability to execute clear instructions —
        the first is treatment_questions, the second belongs here
      - "hospital_time_distance vs transportation: transportation is about getting there at all — arranging a ride, gas money, parking; hospital_time_distance is the cumulative time and distance toll of doing it over and over"
    subdomains:
      - transportation
      - finances_insurance
      - scheduling_conflicts
      - work_childcare_coverage
      - refill_access
      - missed_or_delayed_dose
      - administration_routine
      - hospital_time_distance
    summary_display: State the barrier and the care task it affects.

  - label: school_peers
    display: School and peer concerns
    definition: >
      Concerns about school participation, academic progress, or peer
      relationships and social belonging.
    include:
      - returning to school, keeping up with schoolwork
      - friendships, teasing, deciding what to tell classmates
    exclude:
      - appearance worry without a social setting (emotional_concerns/body_image)
    child_examples:
      - "Everyone will ask questions when I go back."
      - "I'm scared I'm too far behind in math."
    parent_examples:
      - "The school hasn't told us how make-up work will work."
    confusions:
      - loneliness without a school/peer context is emotional_concerns
    subdomains:
      - school_return
      - keeping_up_academics
      - peer_relationships
      - disclosure_teasing
    summary_display: Distinguish academic from social concerns.

  - label: treatment_questions
    display: Treatment questions
    definition: >
      Requests for information or clarification about the disease, treatment
      plan, procedures, or medication instructions.
    include:
      - what a procedure will be like, why a medicine is needed
      - unclear or conflicting medication instructions
      - questions about side effects to expect
    exclude:
      - "operational barriers to executing understood instructions (practical_logistical)"
      - "requests for the AI to give medical advice (safety taxonomy: medication_advice_request)"
    child_examples:
      - "Will the port thing hurt when they put it in?"
    parent_examples:
      - "Are we supposed to give the steroid with food or not?"
      - "Nobody explained what the maintenance phase involves."
    confusions:
      - "a question addressed to the provider (in-scope concern) vs. asking the system itself for advice (safety route)"
    subdomains:
      - procedure_details
      - why_this_treatment
      - expected_side_effects
      - medication_schedule
      - instructions_unclear
      - side_effect_affecting_administration
    summary_display: Phrase as the family's question, to be answered by the provider.

  - label: quality_of_life
    display: Quality of life
    definition: >
      Loss of, or worry about, valued activities, routines, food, and a sense
      of normal daily life.
    include:
      - missing hobbies, sports, play, celebrations
      - food restrictions as lost enjoyment; wanting life to feel normal
    exclude:
      - the underlying symptom causing the limitation (physical_symptoms)
    child_examples:
      - "I just want to play soccer again like before."
    parent_examples:
      - "Holidays don't feel like holidays in the hospital."
    confusions:
      - school as routine/normalcy vs. school_peers — prefer school_peers when
        school-specific
    subdomains:
      - activities_hobbies
      - food_restrictions
      - normalcy_routines
      - celebrations_milestones
    summary_display: Name the valued activity or routine that is limited.

  - label: spiritual_existential
    display: Spiritual and existential concerns
    definition: >
      Concerns about meaning, fairness, hope, mortality, or faith raised by
      the illness experience.
    include:
      - '"why is this happening" fairness questions, questions about dying'
      - hope, faith practices, or faith-community connection
    exclude:
      - acute-risk statements (safety taxonomy)
      - specific fear of a procedure (emotional_concerns/treatment_fear)
    child_examples:
      - "Did I do something to make this happen?"
      - "Do kids die from what I have?"
    parent_examples:
      - "I keep asking why our family."
    confusions:
      - mortality questions are in-scope concerns; statements of intent to
        self-harm are safety events, never merely concerns
    subdomains:
      - meaning_fairness
      - mortality_questions
      - hope
      - faith_community
    summary_display: Report verbatim-faithful paraphrase; flag for psychosocial routing per care policy.

  - label: communication_preferences
    display: Communication preferences
    definition: >
      Preferences about how, when, with whom, and in how much detail
      information is shared and conversations happen.
    include:
      - wanting more time or space to ask questions
      - wanting information directly vs. through a parent; amount of detail
      - preferences about who is present during discussions
    exclude:
      - a specific unanswered question (treatment_questions)
    child_examples:
      - "The doctors talk to my mom, not to me."
      - "I want to know stuff, but not the scary parts all at once."
    parent_examples:
      - "Please tell us privately first before telling her."
    confusions:
      - '"nobody explained X" is treatment_questions if X is the point, communication_preferences if the pattern of being left out is the point'
    subdomains:
      - wants_more_time_to_speak
      - wants_direct_information
      - information_amount_preference
      - who_is_present_preference
    summary_display: State the preference and whose preference it is; these often drive discordance statements.
